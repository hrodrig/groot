kubeconfig: ""
output_dir: "./out"
file_prefix: "groot-capture"

collection:
  timeout: 20m
  worker_concurrency: 6
  namespaces:
    - kube-system
    - default
  targets:
    default:
      deployments:
        - api
      statefulsets:
        - redis
      daemonsets:
        - node-agent
      helm_releases:
        - my-release
  include_pod_logs: true
  include_previous_logs: true
  pod_log_tail_lines: 1500
  include_node_details: true
  extra_kubectl:
    - "get componentstatuses"
    - "get csr"

notify:
  slack:
    enabled: false
    # Multiple Slack incoming webhooks: separate full URLs with ';'
    webhook_url: ""

  discord:
    enabled: false
    webhook_url: ""

  teams:
    enabled: false
    # Multiple Teams incoming webhooks: same ';' separator
    webhook_url: ""

  pagerduty:
    enabled: false
    routing_key: ""
    severity: "warning"
    source: "groot"

  telegram:
    enabled: false
    token: ""
    # Multiple chats: same bot token, separate chat ids with ';'
    chat_id: ""

  generic:
    enabled: false
    # One JSON field only (json_key + summary text); see README Notifications
    webhook_url: ""
    json_key: "text"
    headers: {}
