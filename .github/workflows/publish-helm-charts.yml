# Publishes the GROOT Helm chart to GitHub Pages on this repo (https://hrodrig.github.io/groot).
# Chart sources live in groot-selfhosted; this workflow packages them and updates gh-pages here.
#
# Triggered by groot-selfhosted release tags (repository_dispatch) or manual workflow_dispatch.
# One-time: Settings → Pages → Source gh-pages / (root).
name: Publish Helm charts

on:
  repository_dispatch:
    types: [publish-helm-charts]
  workflow_dispatch:
    inputs:
      ref:
        description: "groot-selfhosted git ref (tag, e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout groot (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout groot-selfhosted chart sources
        uses: actions/checkout@v4
        with:
          repository: hrodrig/groot-selfhosted
          ref: ${{ github.event.client_payload.ref || inputs.ref }}
          path: selfhosted
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure gh-pages branch exists (groot repo)
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse HEAD)
          git fetch origin
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "Remote branch gh-pages already exists on groot."
          else
            echo "Creating orphan gh-pages on groot (first Helm chart publish)..."
            git checkout --orphan gh-pages-init
            git rm -rf . 2>/dev/null || true
            printf '%s\n' '# Helm chart index (updated by chart-releaser)' > README.md
            : > .nojekyll
            git add README.md .nojekyll
            git commit -m "chore: initialize gh-pages for Helm chart index"
            git push origin HEAD:gh-pages
            git checkout "$TAG_SHA"
          fi
          git fetch origin

      # chart-releaser v1.7+ uses cr package/upload/index (not `cr release`).
      # Run upstream cr.sh from the selfhosted git root so tag-based change detection works.
      - name: Run chart-releaser (selfhosted git → groot gh-pages)
        working-directory: selfhosted
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/cr.sh https://raw.githubusercontent.com/helm/chart-releaser-action/v1.7.0/cr.sh
          chmod +x /tmp/cr.sh
          /tmp/cr.sh \
            --owner hrodrig \
            --repo groot \
            --charts-dir run/deploy/helm \
            --skip-existing true \
            --version v1.7.0

      - name: Publish Helm repo landing page (GitHub Pages)
        run: |
          set -euo pipefail
          LANDING_DIR="${GITHUB_WORKSPACE}/selfhosted/run/deploy/helm/helm-repo-landing"
          test -f "$LANDING_DIR/index.html"
          test -f "$LANDING_DIR/.nojekyll"
          cp "$LANDING_DIR/index.html" /tmp/helm-pages-index.html
          cp "$LANDING_DIR/.nojekyll" /tmp/helm-pages-nojekyll
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/helm-pages-index.html index.html
          cp /tmp/helm-pages-nojekyll .nojekyll
          git add index.html .nojekyll
          if git diff --staged --quiet; then
            echo "index.html / .nojekyll unchanged on gh-pages"
          else
            git commit -m "docs(helm): sync GitHub Pages landing + .nojekyll for Helm index"
            git push origin gh-pages
          fi
