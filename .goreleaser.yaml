version: 2

project_name: groot

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: groot
    main: ./cmd/groot
    binary: groot
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.branch={{.Branch}}
      - -X main.buildDate={{.Date}}

archives:
  - id: groot-dist
    ids:
      - groot
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # {{ .Tag }} keeps the family convention with pgwd/kzero: artifact
    # basenames embed the v-prefixed tag, matching the URL path
    # (.../releases/download/v0.6.0/groot_v0.6.0_*.tar.gz). This is a
    # breaking rename for anyone scripting off the old `groot_0.5.0_*`
    # form; paired with Homebrew cask landing in the same release.
    name_template: "groot_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: groot-packages
    package_name: groot
    file_name_template: "groot_{{ .Tag }}_{{ .Arch }}"
    ids:
      - groot
    vendor: hrodrig
    homepage: https://github.com/hrodrig/groot
    maintainer: hrodrig
    description: |-
      GROOT is a Go CLI that collects Kubernetes diagnostics (resources, events,
      pod logs, node details, and optional notifications).
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: configs/groot.yml.sample
        dst: /etc/groot/groot.yml.sample
        type: config|noreplace
    deb:
      lintian_overrides:
        - statically-linked-binary

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^\\.github:"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# SBOM (Software Bill of Materials) generation. Produces a SPDX-JSON
# and a CycloneDX-JSON document for every released archive. The
# generated SBOMs land as `out: groot_<tag>_sbom.spdx.json` and
# `out: groot_<tag>_sbom.cyclonedx.json` in the GitHub Release.
#
# Container image SBOM is intentionally NOT enabled here:
# `dockers_v2.sbom: true` requires the `docker buildx` driver to be
# `docker-container` (so GoReleaser can attach the OCI attestation
# via buildx's --attestation=type=sbom flag). The current workflow
# uses the default `docker` driver; switching drivers is a follow-up
# for 0.7.x. The Go module dependency list is identical for the
# image and the archive, so the archive SBOM fully describes what
# runs in the container.
#
# `artifacts: archive` covers the `.tar.gz` releases that operators
# download directly. `binary` would also work; archives are the
# primary download path.
sboms:
  - id: archive-sbom
    artifacts: archive
    # `archive` artifacts accept a single format (goreleaser v2).
    # SPDX-JSON is the de facto standard for downstream tooling
    # (sigstore, in-toto, syft, grype, cdxgen all consume it).
    documents:
      - spdx-json
  - id: binary-sbom
    artifacts: binary
    # Binary artifacts accept multiple formats. The CycloneDX
    # document is paired with the SPDX one above for consumers
    # that prefer CycloneDX (e.g. Anchore, dependency-track).
    documents:
      - cyclonedx-json

# Multi-arch images via pre-built binaries (Dockerfile.release).
# sbom: false — many buildx setups lack attestation support for the docker driver.
dockers_v2:
  - dockerfile: Dockerfile.release
    sbom: false
    ids:
      - groot
    extra_files:
      - configs/groot.yml.sample
    images:
      - ghcr.io/hrodrig/groot
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "groot"
      org.opencontainers.image.description: "Go Kubernetes diagnostics collector CLI"
      org.opencontainers.image.source: "https://github.com/hrodrig/groot"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

# Homebrew cask tap: on every release tag, GoReleaser generates the
# cask from this stanza and pushes a branch (or PR) to the
# hrodrig/homebrew-groot tap repo.
#
# The on-disk template at contrib/homebrew/Casks/groot.rb.template
# is the human-readable source of truth; GoReleaser does NOT read it
# (cask files are generated, not templated), but it lets a reviewer
# know what the rendered file will look like and supports the manual
# fallback path (scripts/update-homebrew-cask.sh).
#
# Required CI secret: HOMEBREW_TAP_TOKEN (PAT with `repo` scope on
# hrodrig/homebrew-groot). Skip with `--skip=homebrew_casks` if the
# token is missing.
homebrew_casks:
  - name: groot
    ids:
      - groot
    binaries:
      - groot
    repository:
      owner: hrodrig
      name: homebrew-groot
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/hrodrig/groot
    description: "Read-only log and context collector for Kubernetes"
    license: MIT
    # Generate the URL from the released .tar.gz artifact matching
    # the v-prefixed tag pattern (post 0.6.x).
    url:
      template: "https://github.com/hrodrig/groot/releases/download/{{ .Tag }}/groot_{{ .Tag }}_{{ .Os }}_{{ .Arch }}.tar.gz"
      verified: "github.com/hrodrig/groot/"
    # skip_upload keeps goreleaser from creating a GitHub release for
    # the tap repo (the tap only ever gets a commit on its main branch).
    skip_upload: true
    custom_block: |
      livecheck do
        url :stable
        strategy :github_latest_release
      end
      zap trash: "~/.config/groot"
      caveats <<~EOS
        Sample configuration is not bundled with the Homebrew cask.
        Copy from the upstream repo or generate with
        `groot --print-sample-config > ~/.config/groot/groot.yml`.
      EOS
