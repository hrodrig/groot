version: 2

project_name: groot

before:
  hooks:
    - go mod tidy
    - go test ./...
    - sh -c 'gzip -cn contrib/man/man1/groot.1 > contrib/man/man1/groot.1.gz'
    - sh -c 'gzip -cn contrib/man/man1/kubectl-groot.1 > contrib/man/man1/kubectl-groot.1.gz'

builds:
  - id: groot
    main: ./cmd/groot
    binary: groot
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.branch={{.Branch}}
      - -X main.buildDate={{.Date}}
  # kubectl-groot: same entry, second basename. kubectl plugin discovery
  # picks any `kubectl-<name>` on PATH and forwards argv[2:] to it after
  # stripping `kubectl <name>`. We do not actually expect kubectl to launch
  # this directly via plugin dispatch in the simple case — instead users
  # install the binary, and `kubectl` resolves it on `kubectl groot …`
  # because of the basename convention. See `pkg/cmd/plugin.MaybeInject`
  # for the argv-rewriting shim that ALSO makes the standalone binary
  # accept "groot …" as if it were already a plugin invocation (useful
  # when invoked from an MCP/agent that mimics kubectl CLI shape).
  - id: kubectl-groot
    main: ./cmd/groot
    binary: kubectl-groot
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s
      - -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.branch={{.Branch}}
      - -X main.buildDate={{.Date}}

archives:
  - id: groot-dist
    ids:
      - groot
      - kubectl-groot
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # {{ .Tag }} keeps the family convention with pgwd/kzero: artifact
    # basenames embed the v-prefixed tag, matching the URL path
    # (.../releases/download/v0.6.0/groot_v0.6.0_*.tar.gz). This is a
    # breaking rename for anyone scripting off the old `groot_0.5.0_*`
    # form; paired with Homebrew cask landing in the same release.
    name_template: "groot_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - src: LICENSE
        dst: share/doc/groot/LICENSE
      - src: configs/groot.yml.sample
        dst: share/examples/groot/groot.yml.sample
      - src: contrib/man/man1/groot.1
        dst: share/man/man1/groot.1
      - src: contrib/man/man1/kubectl-groot.1
        dst: share/man/man1/kubectl-groot.1

nfpms:
  - id: groot-packages
    package_name: groot
    file_name_template: "groot_{{ .Tag }}_{{ .Arch }}"
    ids:
      - groot
      - kubectl-groot
    vendor: hrodrig
    homepage: https://github.com/hrodrig/groot
    maintainer: hrodrig
    description: |-
      GROOT is a Go CLI that collects Kubernetes diagnostics (resources, events,
      pod logs, node details, and optional notifications). Also shipped as the
      `kubectl-groot` plugin binary so users can invoke it as `kubectl groot …`.
    license: MIT
    scripts:
      preremove: contrib/deb/prerm.sh
      postremove: contrib/deb/postrm.sh
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: configs/groot.yml.sample
        dst: /etc/groot/groot.yml.sample
        type: config|noreplace
      - src: contrib/man/man1/groot.1.gz
        dst: /usr/share/man/man1/
      - src: contrib/man/man1/kubectl-groot.1.gz
        dst: /usr/share/man/man1/
    deb:
      lintian_overrides:
        - statically-linked-binary

checksum:
  name_template: checksums.txt

# Cosign keyless signing (GitHub Actions OIDC). Requires `id-token: write`
# in release.yml and sigstore/cosign-installer. Signs checksums.txt and
# container images pushed to ghcr.io.
signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - --yes
    artifacts: checksum

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^\\.github:"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# SBOM (Software Bill of Materials) generation via syft.
# One SPDX + one CycloneDX document per release (source tree catalog).
# Do not use per-archive/per-binary documents with bare format names
# (e.g. "spdx-json") — GoReleaser would emit duplicate release asset
# names and GitHub upload fails with 422 already_exists / draft release.
#
sboms:
  - id: groot-sbom-spdx
    artifacts: source
    documents:
      - "groot_{{ .Version }}_sbom.spdx.json"
    args: ["$artifact", "--output", "spdx-json=$document"]
  - id: groot-sbom-cdx
    artifacts: source
    documents:
      - "groot_{{ .Version }}_sbom.cyclonedx.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# Multi-arch images via pre-built binaries (Dockerfile.release).
# sbom: true — OCI SBOM attestation now enabled (buildx docker-container driver
# set up in release workflow via docker/setup-buildx-action@v3).
dockers_v2:
  - dockerfile: Dockerfile.release
    sbom: true
    ids:
      - groot
      - kubectl-groot
    extra_files:
      - configs/groot.yml.sample
    images:
      - ghcr.io/hrodrig/groot
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "groot"
      org.opencontainers.image.description: "Go Kubernetes diagnostics collector CLI"
      org.opencontainers.image.source: "https://github.com/hrodrig/groot"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

# Cosign keyless signing for container manifests built by dockers_v2.
docker_signs:
  - cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    args:
      - sign
      - "${artifact}@${digest}"
      - --yes

# Homebrew cask tap: on every release tag, GoReleaser generates the
# cask from this stanza and pushes to hrodrig/homebrew-groot (main).
#
# Required CI secret: HOMEBREW_TAP_TOKEN (PAT with `repo` scope on
# hrodrig/homebrew-groot).
homebrew_casks:
  - name: groot
    ids:
      - groot-dist
    binaries:
      - groot
      - kubectl-groot
    repository:
      owner: hrodrig
      name: homebrew-groot
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/hrodrig/groot
    description: "Read-only log and context collector for Kubernetes (also ships the kubectl-groot plugin)"
    license: MIT
    manpages:
      - share/man/man1/groot.1
      - share/man/man1/kubectl-groot.1
    # Generate the URL from the released .tar.gz artifact matching
    # the v-prefixed tag pattern (post 0.6.x).
    url:
      template: "https://github.com/hrodrig/groot/releases/download/{{ .Tag }}/groot_{{ .Tag }}_{{ .Os }}_{{ .Arch }}.tar.gz"
      verified: "github.com/hrodrig/groot/"
    commit_author:
      name: Hermes Rodríguez
      email: hrodrig@usb.ve
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/groot"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kubectl-groot"]
          end
    custom_block: |
      zap trash: "~/.config/groot"
      caveats <<~EOS
        Sample configuration is not bundled with the Homebrew cask.
        Copy from the upstream repo or generate with
        `groot --print-sample-config > ~/.config/groot/groot.yml`.
      EOS
