# Standalone Kubernetes manifests for scheduled in-cluster collection.
# Prefer Helm: deploy/helm/groot/README.md

---
apiVersion: v1
kind: Namespace
metadata:
  name: groot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: groot
  namespace: groot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: groot-collector
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: groot-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: groot-collector
subjects:
  - kind: ServiceAccount
    name: groot
    namespace: groot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: groot-config
  namespace: groot
data:
  groot.yml: |
    output_dir: /out
    file_prefix: groot-capture
    collection:
      timeout: 20m
      worker_concurrency: 4
      namespaces:
        - kube-system
        - default
      include_pod_logs: true
      include_node_details: true
      include_node_logs: false
    notify:
      on_failure:
        enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: groot-out
  namespace: groot
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: groot-collect
  namespace: groot
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: groot
          restartPolicy: OnFailure
          containers:
            - name: groot
              image: ghcr.io/hrodrig/groot:0.5.0
              args: ["collect", "--config", "/config/groot.yml"]
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: out
                  mountPath: /out
          volumes:
            - name: config
              configMap:
                name: groot-config
            - name: out
              persistentVolumeClaim:
                claimName: groot-out
