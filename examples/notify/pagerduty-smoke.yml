# PagerDuty Events API v2 smoke for `groot notify test`.
# Secrets: export GROOT_NOTIFY_PAGERDUTY_ROUTING_KEY
# Multiple keys: separate with ';'

config_version: 1
kubeconfig: ~/.kube/config
output_dir: ./out
collection:
  worker_concurrency: 1
  namespaces: [kube-system]
  include_pod_logs: false
  include_node_details: false
  include_node_logs: false
  include_pod_metrics: false
notify:
  slack: { enabled: false }
  discord: { enabled: false }
  teams: { enabled: false }
  telegram: { enabled: false }
  generic: { enabled: false }
  email: { enabled: false }
  pagerduty:
    enabled: true
    routing_key: ""
    severity: warning
    source: groot
  on_failure:
    enabled: true
    on_abort: true
    min_failed_jobs: 1
