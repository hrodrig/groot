# Post-collect upload to S3 (or S3-compatible endpoint).
# Enable upload + fill bucket/region; credentials via AWS SDK default chain
# or GROOT_UPLOAD_S3_* env (see SPEC / sample config).
# Operator playbook (Contabo): groot-selfhosted run/examples/s3-contabo/
# Run: groot collect --config examples/upload/s3.yml

config_version: 1
kubeconfig: ~/.kube/config
output_dir: ./out
file_prefix: groot-s3
collection:
  timeout: 10m
  worker_concurrency: 4
  namespaces:
    - default
    - kube-system
  include_pod_logs: true
  include_previous_logs: false
  pod_log_tail_lines: 200
  include_node_details: false
  include_node_logs: false
  include_pod_metrics: false
notify:
  slack: { enabled: false }
  discord: { enabled: false }
  teams: { enabled: false }
  telegram: { enabled: false }
  generic: { enabled: false }
  pagerduty: { enabled: false }
  email: { enabled: false }
upload:
  enabled: true
  continue_on_error: true
  timeout: 5m
  s3:
    enabled: true
    bucket: "YOUR_BUCKET"
    region: "us-east-1"
    key_prefix: "groot-archives"
    # endpoint: "https://s3.amazonaws.com"
  gcs:
    enabled: false
  sftp:
    enabled: false
