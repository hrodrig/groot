# bastion-airgap.yml — airgapped bastion with SFTP relay
# Collect from a bastion/VPN host, push via SFTP, no external notify webhooks.
output_dir: "/var/tmp/groot-out"
file_prefix: "bastion-snapshot"
notify:
  slack:
    enabled: false
  discord:
    enabled: false
  teams:
    enabled: false
  telegram:
    enabled: false
  generic:
    enabled: false
  pagerduty:
    enabled: false
  email:
    enabled: false
upload:
  s3:
    enabled: false
  gcs:
    enabled: false
  sftp:
    enabled: true
    host: "relay.corp.internal"
    port: 22
    user: "groot-sync"
    key_path: "/etc/groot/id_ed25519"
    remote_dir: "/incoming/"
collection:
  timeout: 120s
  worker_concurrency: 4
  namespaces:
    - default
    - kube-system
  include_pod_logs: true
  include_previous_logs: false
  pod_log_tail_lines: 200
  pod_logs_since: ""
  include_node_details: true
  include_node_logs: false
  include_pod_metrics: true
  redact_secrets: true
